<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

/* ===================== DESIGN TOKENS ===================== */
:root{
  --bg:#070B14;
  --bg-2:#0D1320;
  --card:rgba(17, 24, 39, 0.7);
  --card-hover:rgba(20, 30, 48, 0.9);
  --border:rgba(30, 41, 59, 0.8);
  --border-soft:rgba(24, 34, 52, 0.6);
  --text:#F5F7FA;
  --text-dim:#8B96A8;
  --text-faint:#5B6576;
  --cyan:#22D3C7;
  --blue:#3B82F6;
  --whatsapp:#25D366;
  --radius:12px;
  --radius-lg:20px;
  --shadow:0 10px 30px -10px rgba(0,0,0,0.5);
  --shadow-lg:0 20px 50px -15px rgba(34, 211, 199, 0.2);
  --glow:0 0 25px rgba(34,211,199,0.35);
  --font-display:'Manrope', ui-sans-serif, sans-serif;
  --font-body:'Inter', ui-sans-serif, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
  --max-w:1280px;
  color-scheme: dark;
}

:root[data-theme="light"]{
  --bg:#F7F8FB;
  --bg-2:#FFFFFF;
  --card:rgba(255, 255, 255, 0.85);
  --card-hover:rgba(242, 245, 250, 0.95);
  --border:#E3E7EF;
  --border-soft:#EBEEF4;
  --text:#0E1420;
  --text-dim:#5B6576;
  --text-faint:#8B96A8;
  --cyan:#0E9C8F;
  --blue:#2563EB;
  color-scheme: light;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease;
  overflow-x:hidden;
}

/* Dynamic Animated Background Mesh */
body::before {
  content: "";
  position: fixed;
  top: -20%; left: -20%;
  width: 140%; height: 140%;
  background: 
    radial-gradient(circle at 15% 20%, rgba(34, 211, 199, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 60%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
  z-index: -1;
  animation: meshFloat 18s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes meshFloat {
  0% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-30px) scale(1.03); }
  100% { transform: translateY(20px) scale(0.98); }
}

img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.18;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,4.6vw,3.6rem);letter-spacing:-.02em}
h2{font-size:clamp(1.5rem,2.6vw,2.15rem)}
h3{font-size:1.15rem}
p{margin:0 0 1em;color:var(--text-dim)}
.container{max-width:var(--max-w);margin:0 auto;padding:0 24px}
section{padding:80px 0}

.gradient-text {
  background: linear-gradient(135deg, var(--text) 30%, var(--cyan) 70%, var(--blue) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}

.eyebrow{
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--cyan);display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;
}
.eyebrow::before{content:"";width:14px;height:1.5px;background:var(--cyan);display:inline-block}

/* ===================== BUTTONS ===================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-body);font-weight:600;font-size:.92rem;
  padding:13px 24px;border-radius:10px;border:1px solid transparent;
  cursor:pointer;transition:all .25s cubic-bezier(0.16, 1, 0.3, 1);
  white-space:nowrap;line-height:1;position:relative;overflow:hidden;
}
.btn-primary{
  background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04121A;
  box-shadow: 0 4px 15px rgba(34, 211, 199, 0.2);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-2px)}
.btn-wa{background:var(--whatsapp);color:#04250F}
.btn-wa:hover{transform:translateY(-2px);box-shadow:0 10px 26px -10px rgba(37,211,102,.55)}
.btn-sm{padding:9px 16px;font-size:.82rem;border-radius:8px}

/* ===================== HEADER ===================== */
header.site-header{
  position:sticky;top:0;z-index:100;background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--border-soft);
}
.nav-wrap{max-width:var(--max-w);margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;flex-shrink:0;transition:transform 0.4s ease}
.brand:hover .brand-mark { transform: rotate(180deg) scale(1.05); }
.brand-word{font-family:var(--font-display);font-weight:800;font-size:1.08rem}
.brand-word span{color:var(--cyan)}
nav.primary-nav{display:flex;align-items:center;gap:30px}
nav.primary-nav a{
  font-size:.92rem;font-weight:500;color:var(--text-dim);
  transition:color .2s;position:relative;padding:4px 0;
}
nav.primary-nav a:hover,nav.primary-nav a.active{color:var(--text)}
nav.primary-nav a::after{
  content:"";position:absolute;left:50%;bottom:-4px;width:0;height:2px;
  background:linear-gradient(90deg,var(--cyan),var(--blue));
  transition:all .3s ease;transform: translateX(-50%);border-radius:2px;
}
nav.primary-nav a:hover::after, nav.primary-nav a.active::after{width:100%}

.nav-actions{display:flex;align-items:center;gap:10px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text);transition:all 0.2s ease;
}
.icon-btn:hover { border-color: var(--cyan); color: var(--cyan); transform: translateY(-1px); }
.icon-btn svg{width:17px;height:17px}
.icon-btn .icon-moon{display:none}
:root[data-theme="light"] .icon-btn .icon-sun{display:none}
:root[data-theme="light"] .icon-btn .icon-moon{display:block}

/* ===================== HERO ===================== */
.hero{position:relative;overflow:hidden;padding:100px 0 80px;border-bottom:1px solid var(--border-soft)}
.hero-inner{position:relative;z-index:1;max-width:760px;margin: 0 auto; text-align: center;}
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.hero-stats{display:flex;justify-content:center;gap:40px;margin-top:48px;flex-wrap:wrap}
.hero-stat b{font-family:var(--font-mono);font-size:1.6rem;display:block;color:var(--text)}
.hero-stat span{font-size:.82rem;color:var(--text-dim)}

/* Floating Particles */
.particle {
  position: absolute; border-radius: 50%;
  background: rgba(34, 211, 199, 0.4);
  animation: floatUp 8s linear infinite; pointer-events: none;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  50% { opacity: 0.8; }
  100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* ===================== CARDS & TILT ===================== */
.cat-grid, .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}

.cat-card, .tool-card{
  background:var(--card);
  backdrop-filter: blur(12px);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:24px;display:flex;flex-direction:column;gap:14px;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.35s ease;
  position:relative;
  transform-style: preserve-3d;
  will-change: transform;
}
.cat-card:hover, .tool-card:hover{
  transform:translateY(-6px) scale(1.01);
  box-shadow:var(--shadow-lg);
  border-color:color-mix(in srgb, var(--cyan) 45%, var(--border));
}

.cat-icon{
  width:46px;height:46px;border-radius:12px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--cyan) 18%, transparent), color-mix(in srgb, var(--blue) 18%, transparent));
  display:flex;align-items:center;justify-content:center;color:var(--cyan);flex-shrink:0;
}
.cat-icon svg{width:22px;height:22px}

.tool-top{display:flex;align-items:center;gap:12px}
.tool-logo{
  width:48px;height:48px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;color:var(--cyan);
  background: linear-gradient(135deg, rgba(34, 211, 199, 0.15), rgba(59, 130, 246, 0.15));
  border: 1px solid var(--border); font-size:1.1rem;
}
.tool-name{font-family:var(--font-display);font-weight:700;font-size:1.05rem;margin:0}
.tool-desc{font-size:.88rem;margin:0;flex:1;color:var(--text-dim)}
.tool-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}

/* ===================== CATEGORY TABS & FILTER BAR ===================== */
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.cat-tab{
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-dim);border:1px solid var(--border);padding:8px 16px;border-radius:999px;
  background:var(--card);cursor:pointer;transition:all .2s ease;
}
.cat-tab:hover, .cat-tab.active{border-color:var(--cyan);color:var(--text);transform: translateY(-2px);}
.cat-tab.active{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04121A;border-color:transparent;font-weight:600}

.filter-bar{
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:24px;
  backdrop-filter: blur(10px);
}
.filter-bar select, .filter-bar input{
  font-family:var(--font-body);font-size:.88rem;padding:10px 14px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg-2);color:var(--text);outline:none;transition: border-color 0.2s ease;
}
.filter-bar select:focus, .filter-bar input:focus{ border-color: var(--cyan); }
.filter-bar input{flex:1;min-width:200px}

/* Badge Pulse Animation */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 0.72rem;
  padding: 4px 10px; border-radius: 20px;
  background: rgba(34, 211, 199, 0.1); color: var(--cyan);
  border: 1px solid rgba(34, 211, 199, 0.3);
}
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan); animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.4; } }

/* ===================== WHATSAPP FLOAT ===================== */
.wa-float{
  position:fixed;right:24px;bottom:24px;z-index:90;
  width:58px;height:58px;border-radius:50%;background:var(--whatsapp);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px -8px rgba(37,211,102,.55);color:#04250F;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  animation: floatBounce 4s ease-in-out infinite;
}
.wa-float:hover{transform: scale(1.15) rotate(10deg); box-shadow: 0 15px 30px rgba(37, 211, 102, 0.6);}
@keyframes floatBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* Dynamic Animations */
.fade-in { animation: fadeIn 0.5s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* Footer */
footer.site-footer{border-top:1px solid var(--border-soft);padding:60px 0 30px;margin-top:60px;background:var(--bg-2)}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-top:24px;border-top:1px solid var(--border-soft);font-size:.82rem;color:var(--text-faint)}
</style>
</head>

<script>
const WHATSAPP_NUMBER = "923086831350";

const CATEGORIES = [
  { slug: "script-writing", name: "AI Script Writing", desc: "Turn topics into video & ad scripts." },
  { slug: "video-generation", name: "AI Video Generation", desc: "Text-to-video, avatars, and smart editing." },
  { slug: "image-generation", name: "AI Image Generation", desc: "Photorealistic art & image editing." },
  { slug: "voice-audio", name: "AI Voice & Text-to-Speech", desc: "Natural voice cloning & voiceovers." },
  { slug: "automation", name: "AI Automation", desc: "Workflow and task automation tools." },
  { slug: "content-writing", name: "AI Content Writing", desc: "Articles, blogs, and marketing copy." }
];

const TOOLS = [
  { id: "chatgpt", name: "ChatGPT Plus", category: "script-writing", desc: "Advanced reasoning, custom GPTs, and writing assistant.", tag: "Popular" },
  { id: "midjourney", name: "Midjourney", category: "image-generation", desc: "Generate stunning hyper-realistic AI images from text prompts.", tag: "Trending" },
  { id: "elevenlabs", name: "ElevenLabs", category: "voice-audio", desc: "Ultra-realistic text-to-speech with natural AI voices.", tag: "Featured" },
  { id: "runway", name: "Runway Gen-2", category: "video-generation", desc: "Generate cinematic video clips directly from text or images.", tag: "Hot" },
  { id: "claude", name: "Claude 3.5 Sonnet", category: "content-writing", desc: "Top tier AI for deep research, coding & writing.", tag: "Pro Pick" },
  { id: "make", name: "Make.com AI", category: "automation", desc: "Connect apps & build complex automated AI workflows.", tag: "Smart" }
];

// Router Engine
function router() {
  const hash = window.location.hash.replace("#/", "") || "";
  const app = document.getElementById("app");
  
  // Highlight active link
  document.querySelectorAll(".primary-nav a").forEach(a => {
    a.classList.toggle("active", a.getAttribute("data-route") === hash);
  });

  if (hash === "" || hash === "/") {
    renderHome(app);
  } else if (hash === "tools") {
    renderTools(app);
  } else if (hash === "categories") {
    renderCategories(app);
  } else if (hash === "contact") {
    renderContact(app);
  } else {
    renderTools(app);
  }

  initTiltEffect();
}

// Pages
function renderHome(container) {
  container.innerHTML = `
    <div class="hero">
      <div id="particle-container"></div>
      <div class="hero-inner fade-in">
        <div class="badge" style="margin-bottom:16px"><span class="pulse-dot"></span> Next-Gen AI Directory</div>
        <h1>Unlock Top-Tier Intelligence with <span class="gradient-text">AI Tools by SK</span></h1>
        <p>Browse curated AI tools and get direct access support fast on WhatsApp with custom order confirmation.</p>
        <div class="hero-cta">
          <a href="#/tools" class="btn btn-primary">Browse Directory ✨</a>
          <a href="https://wa.me/${WHATSAPP_NUMBER}" target="_blank" class="btn btn-wa">Order via WhatsApp</a>
        </div>
        <div class="hero-stats">
          <div class="hero-stat"><b>50+</b><span>Curated Tools</span></div>
          <div class="hero-stat"><b>6</b><span>Core Categories</span></div>
          <div class="hero-stat"><b>Instant</b><span>WA Delivery</span></div>
        </div>
      </div>
    </div>
    
    <section class="container">
      <h2 class="gradient-text" style="margin-bottom:24px">Featured AI Tools</h2>
      <div class="tools-grid">
        ${TOOLS.map(t => createToolCard(t)).join('')}
      </div>
    </section>
  `;
  initParticles();
}

function renderTools(container) {
  container.innerHTML = `
    <section class="container fade-in">
      <h1 class="gradient-text">Explore AI Tools</h1>
      <p>Filter or search through leading tools available for instant order.</p>
      
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search AI tools..." oninput="filterTools()">
        <select id="catSelect" onchange="filterTools()">
          <option value="all">All Categories</option>
          ${CATEGORIES.map(c => `<option value="${c.slug}">${c.name}</option>`).join('')}
        </select>
      </div>

      <div class="tools-grid" id="filteredGrid">
        ${TOOLS.map(t => createToolCard(t)).join('')}
      </div>
    </section>
  `;
}

function renderCategories(container) {
  container.innerHTML = `
    <section class="container fade-in">
      <h1 class="gradient-text">Browse Categories</h1>
      <p style="margin-bottom:30px">Choose a specific domain to solve your workflow challenges.</p>
      <div class="cat-grid">
        ${CATEGORIES.map(c => `
          <div class="cat-card" onclick="window.location.hash='#/tools'">
            <div class="cat-icon">⚡</div>
            <h3>${c.name}</h3>
            <p>${c.desc}</p>
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

function renderContact(container) {
  container.innerHTML = `
    <section class="container fade-in" style="max-width:600px">
      <h1 class="gradient-text">Get in Touch</h1>
      <p>Have questions about access or pricing? Send us a direct query.</p>
      <div class="cat-card" style="padding:30px">
        <a href="https://wa.me/${WHATSAPP_NUMBER}?text=Hi%20SK,%20I%20have%20a%20question%20about%20AI%20Tools" 
           target="_blank" class="btn btn-wa" style="width:100%">Chat directly on WhatsApp</a>
      </div>
    </section>
  `;
}

// Helpers
function createToolCard(tool) {
  const waMsg = encodeURIComponent(`Hi SK, I am interested in ordering access for ${tool.name}. Please share pricing details.`);
  return `
    <div class="tool-card" data-cat="${tool.category}" data-name="${tool.name.toLowerCase()}">
      <div class="tool-top">
        <div class="tool-logo">${tool.name[0]}</div>
        <div>
          <h3 class="tool-name">${tool.name}</h3>
          <span class="badge" style="margin-top:4px">${tool.tag}</span>
        </div>
      </div>
      <p class="tool-desc">${tool.desc}</p>
      <div class="tool-foot">
        <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}" target="_blank" class="btn btn-primary btn-sm">Order Access</a>
      </div>
    </div>
  `;
}

function filterTools() {
  const query = document.getElementById("searchInput")?.value.toLowerCase() || "";
  const cat = document.getElementById("catSelect")?.value || "all";
  
  document.querySelectorAll("#filteredGrid .tool-card").forEach(card => {
    const matchesQuery = card.dataset.name.includes(query);
    const matchesCat = cat === "all" || card.dataset.cat === cat;
    card.style.display = (matchesQuery && matchesCat) ? "flex" : "none";
  });
}

// Animations & Micro-interactions
function initTiltEffect() {
  document.querySelectorAll('.tool-card, .cat-card').forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left; const y = e.clientY - rect.top;
      const rotateX = (y - rect.height / 2) / 10;
      const rotateY = (rect.width / 2 - x) / 10;
      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-6px)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
    });
  });
}

function initParticles() {
  const particleContainer = document.getElementById('particle-container');
  if(!particleContainer) return;
  for(let i = 0; i < 18; i++) {
    const p = document.createElement('div'); p.className = 'particle';
    p.style.left = `${Math.random() * 100}%`;
    p.style.width = p.style.height = `${Math.random() * 4 + 2}px`;
    p.style.animationDuration = `${Math.random() * 6 + 6}s`;
    p.style.animationDelay = `${Math.random() * 4}s`;
    particleContainer.appendChild(p);
  }
}

// Theme Switcher
document.getElementById("themeToggle").addEventListener("click", () => {
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", isLight ? "dark" : "light");
});

document.getElementById("year").textContent = new Date().getFullYear();
window.addEventListener("hashchange", router);
window.addEventListener("load", router);
</script>
