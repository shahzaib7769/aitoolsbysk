function applyTheme(theme) {

function toggleFavorite(id) {
  if (state.favorites.includes(id)) {

  } else {

}

function getWaLink(toolName = '') {
  const msg = toolName

  return `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`;
}

/* ===================== INTERACTIVE 3D TILT JS ===================== */
function apply3DTiltEffect() {
  const cards = document.querySelectorAll('.cat-card, .tool-card, .step-card, .trust-card, .blog-card');
  
  cards.forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      
      const rotateX = ((y - centerY) / centerY) * -10;
      const rotateY = ((x - centerX) / centerX) * 10;
      
      card.style.transform = `perspective(1000px) translateY(-8px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(12px)`;
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = `perspective(1000px) translateY(0) rotateX(0) rotateY(0) translateZ(0)`;
    });
  });
}

/* ===================== ROUTER & VIEWS ===================== */
function handleRoute() {
  const hash = window.location.hash || '#/';
  const app = document.getElementById('app');
  const navLinks = document.querySelectorAll('nav.primary-nav a');
  
  // Floating WA button target update
  document.getElementById('waFloat').href = getWaLink();

  // Active Nav Link Update
  const routeName = hash.replace('#/', '').split('/')[0];
  navLinks.forEach(link => {
    if (link.getAttribute('data-route') === routeName) {
      link.classList.add('active');
    } else {
      link.classList.remove('active');
    }
  });

  // Simple Router
  if (hash === '#/' || hash === '') {
    app.innerHTML = renderHome();
  } else if (hash.startsWith('#/tools')) {
    const parts = hash.split('/');
    if (parts.length > 2) {
      app.innerHTML = renderToolDetail(parts[2]);
    } else {
      app.innerHTML = renderToolsCatalog();
    }
  } else if (hash === '#/favorites') {
    app.innerHTML = renderFavorites();
  } else if (hash === '#/about') {
    app.innerHTML = renderAbout();
  } else if (hash === '#/contact') {
    app.innerHTML = renderContact();
  } else {
    app.innerHTML = `<section class="container"><h2>404 — Page Not Found</h2><p><a href="#/" class="btn btn-primary">Return Home</a></p></section>`;
  }

  // Re-apply 3D mouse trackers to newly rendered DOM elements
  apply3DTiltEffect();
}
