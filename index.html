<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-white transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">⚡</span>
                <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                    AI Hub
                </h1>
            </div>

            <!-- Dark / Light Mode Toggle Button -->
            <button id="themeToggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative bg-gradient-to-br from-indigo-900 via-gray-900 to-blue-900 text-white py-20 px-4 sm:px-6 lg:px-8 text-center overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-500/20 via-transparent to-transparent"></div>
        <div class="relative max-w-4xl mx-auto">
            
            <!-- FIXED VISIBILITY ISSUE: Background badge backdrop and crisp text contrast -->
            <div class="inline-block mb-4 px-4 py-1.5 rounded-full bg-gray-900/80 border border-indigo-500/30 text-indigo-300 text-sm font-semibold tracking-wide shadow-md backdrop-blur-sm">
                Discover & Access the World's Leading AI Tools
            </div>

            <h2 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-6 drop-shadow-md">
                Find the Perfect AI for Your Workflow
            </h2>
            <p class="text-lg sm:text-xl text-gray-200 max-w-2xl mx-auto mb-8 drop-shadow">
                Explore top-rated artificial intelligence tools categorized for writing, design, coding, marketing, and productivity.
            </p>

            <!-- Search Bar -->
            <div class="max-w-xl mx-auto relative">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search AI tools (e.g. ChatGPT, Midjourney)..." 
                    class="w-full px-5 py-3.5 pl-12 rounded-xl bg-white/10 dark:bg-gray-800/50 backdrop-blur-md border border-white/20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-400 shadow-lg"
                />
                <svg class="w-5 h-5 absolute left-4 top-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow">
        
        <!-- Category Filter Buttons -->
        <div class="flex flex-wrap gap-2 justify-center mb-10" id="categoryContainer">
            <button data-category="All" class="category-btn active bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium text-sm transition-all shadow-sm">All Tools</button>
            <button data-category="Text & Writing" class="category-btn bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 px-4 py-2 rounded-lg font-medium text-sm transition-all">Text & Writing</button>
            <button data-category="Image & Design" class="category-btn bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 px-4 py-2 rounded-lg font-medium text-sm transition-all">Image & Design</button>
            <button data-category="Coding & Dev" class="category-btn bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 px-4 py-2 rounded-lg font-medium text-sm transition-all">Coding & Dev</button>
            <button data-category="Audio & Video" class="category-btn bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 px-4 py-2 rounded-lg font-medium text-sm transition-all">Audio & Video</button>
            <button data-category="Marketing & Sales" class="category-btn bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 px-4 py-2 rounded-lg font-medium text-sm transition-all">Marketing & Sales</button>
            <button data-category="Productivity" class="category-btn bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 px-4 py-2 rounded-lg font-medium text-sm transition-all">Productivity</button>
        </div>

        <!-- AI Tools Grid -->
        <div id="toolsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic JS Rendering Target -->
        </div>

        <!-- No Results Found Message -->
        <div id="noResults" class="hidden text-center py-12">
            <p class="text-xl text-gray-500 dark:text-gray-400">No AI tools found matching your search.</p>
        </div>
    </main>

    <!-- Footer with Social Media Links & Icons -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-8 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p class="text-sm text-gray-500 dark:text-gray-400">
                &copy; 2026 AI Hub. All rights reserved.
            </p>

            <!-- Social Media Linking with Icons -->
            <div class="flex items-center space-x-6">
                <!-- Twitter / X -->
                <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-indigo-500 transition-colors" title="Twitter">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                </a>
                <!-- GitHub -->
                <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-indigo-500 transition-colors" title="GitHub">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                </a>
                <!-- LinkedIn -->
                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-indigo-500 transition-colors" title="LinkedIn">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.78a1.62 1.62 0 1 0 0 3.24 1.62 1.62 0 0 0 0-3.24z"/>
                    </svg>
                </a>
                <!-- Discord -->
                <a href="https://discord.com" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-indigo-500 transition-colors" title="Discord">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .078-.01c3.927 1.793 8.18 1.793 12.061 0a.075.075 0 0 1 .079.009c.12.098.245.195.372.288a.077.077 0 0 1-.006.128 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <!-- JavaScript Data and Logic -->
    <script>
        // Real & Popular AI Tools Data Structured by Categories
        const aiTools = [
            // Text & Writing
            {
                name: "ChatGPT",
                category: "Text & Writing",
                description: "Conversational AI model by OpenAI capable of generating text, answering questions, and writing content.",
                pricing: "Freemium",
                link: "https://chatgpt.com"
            },
            {
                name: "Claude",
                category: "Text & Writing",
                description: "Next-generation AI assistant by Anthropic, excels at long-form writing, analysis, and reasoning.",
                pricing: "Freemium",
                link: "https://claude.ai"
            },
            {
                name: "Jasper AI",
                category: "Text & Writing",
                description: "AI copywriter designed for enterprise marketing teams to create blog posts, ads, and emails.",
                pricing: "Paid",
                link: "https://www.jasper.ai"
            },

            // Image & Design
            {
                name: "Midjourney",
                category: "Image & Design",
                description: "Generates high-quality hyper-realistic images and artwork from text descriptions.",
                pricing: "Paid",
                link: "https://www.midjourney.com"
            },
            {
                name: "Canva AI",
                category: "Image & Design",
                description: "Integrated AI suite in Canva for automatic graphic design, magic edit, and text-to-image creation.",
                pricing: "Freemium",
                link: "https://www.canva.com"
            },
            {
                name: "DALL·E 3",
                category: "Image & Design",
                description: "Advanced image generation model developed by OpenAI, highly accurate to detailed prompts.",
                pricing: "Paid",
                link: "https://openai.com/dall-e-3"
            },

            // Coding & Dev
            {
                name: "GitHub Copilot",
                category: "Coding & Dev",
                description: "AI pair programmer that offers autocomplete code suggestions right inside your editor.",
                pricing: "Paid",
                link: "https://github.com/features/copilot"
            },
            {
                name: "Cursor",
                category: "Coding & Dev",
                description: "An AI-first code editor designed for pair programming with powerful LLM integration.",
                pricing: "Freemium",
                link: "https://www.cursor.com"
            },
            {
                name: "v0.dev",
                category: "Coding & Dev",
                description: "Generative UI system by Vercel that creates React and Tailwind components from prompts.",
                pricing: "Freemium",
                link: "https://v0.dev"
            },

            // Audio & Video
            {
                name: "ElevenLabs",
                category: "Audio & Video",
                description: "Realistic AI voice generator for text-to-speech, voice cloning, and audio dubbing.",
                pricing: "Freemium",
                link: "https://elevenlabs.io"
            },
            {
                name: "Descript",
                category: "Audio & Video",
                description: "All-in-one video and podcast editor that lets you edit media by editing transcribed text.",
                pricing: "Freemium",
                link: "https://www.descript.com"
            },
            {
                name: "RunwayML",
                category: "Audio & Video",
                description: "Advanced generative AI tools for video generation, motion control, and visual effects.",
                pricing: "Freemium",
                link: "https://runwayml.com"
            },

            // Marketing & Sales
            {
                name: "HubSpot AI",
                category: "Marketing & Sales",
                description: "AI-powered CRM tools for automating marketing emails, lead scoring, and customer service.",
                pricing: "Freemium",
                link: "https://www.hubspot.com"
            },
            {
                name: "Copy.ai",
                category: "Marketing & Sales",
                description: "AI platform for automating marketing workflows and generating conversion-focused copy.",
                pricing: "Freemium",
                link: "https://www.copy.ai"
            },

            // Productivity
            {
                name: "Notion AI",
                category: "Productivity",
                description: "Integrated AI assistant inside Notion for summarizing notes, writing docs, and organizing tasks.",
                pricing: "Paid",
                link: "https://www.notion.so"
            },
            {
                name: "Perplexity AI",
                category: "Productivity",
                description: "AI-powered search engine delivering direct answers with live source citations.",
                pricing: "Freemium",
                link: "https://www.perplexity.ai"
            }
        ];

        // State Management
        let currentCategory = "All";
        let searchQuery = "";

        // DOM Elements
        const toolsGrid = document.getElementById('toolsGrid');
        const noResults = document.getElementById('noResults');
        const searchInput = document.getElementById('searchInput');
        const categoryButtons = document.querySelectorAll('.category-btn');
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        // Render AI Tools Grid
        function renderTools() {
            toolsGrid.innerHTML = '';

            const filteredTools = aiTools.filter(tool => {
                const matchesCategory = (currentCategory === "All") || (tool.category === currentCategory);
                const matchesSearch = tool.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      tool.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      tool.category.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filteredTools.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                filteredTools.forEach(tool => {
                    const card = document.createElement('div');
                    card.className = "bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1";
                    
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 border border-indigo-100 dark:border-indigo-900">
                                    ${tool.category}
                                </span>
                                <span class="text-xs font-medium text-gray-500 dark:text-gray-400">
                                    ${tool.pricing}
                                </span>
                            </div>
                            <h3 class="text-xl font-bold mb-2 text-gray-900 dark:text-white">${tool.name}</h3>
                            <p class="text-sm text-gray-600 dark:text-gray-300 mb-6 leading-relaxed">
                                ${tool.description}
                            </p>
                        </div>
                        <a href="${tool.link}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center justify-center w-full px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition-colors">
                            Visit Tool ➔
                        </a>
                    `;
                    toolsGrid.appendChild(card);
                });
            }
        }

        // Category Filter Listener
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                    b.classList.add('bg-white', 'dark:bg-gray-800', 'border', 'border-gray-200', 'dark:border-gray-700');
                });

                btn.classList.remove('bg-white', 'dark:bg-gray-800', 'border', 'border-gray-200', 'dark:border-gray-700');
                btn.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');

                currentCategory = btn.getAttribute('data-category');
                renderTools();
            });
        });

        // Search Input Listener
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderTools();
        });

        // Dark/Light Theme Switching
        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                themeIcon.textContent = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                themeIcon.textContent = '☀️';
            }
        });

        // Initial Render
        renderTools();
    </script>
</body>
</html>
