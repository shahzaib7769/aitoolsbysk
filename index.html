<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070B14">
<title>AI Tools by SK — Animated Edition</title>
<meta name="description" content="AI Tools by SK is a curated directory of leading AI tools with interactive smooth animations.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%23070B14'/%3E%3Ccircle%20cx='20'%20cy='44'%20r='4.5'%20fill='%2322D3C7'/%3E%3Ccircle%20cx='32'%20cy='20'%20r='4.5'%20fill='%233B82F6'/%3E%3Ccircle%20cx='46'%20cy='40'%20r='4.5'%20fill='%2322D3C7'/%3E%3Cpath%20d='M20%2044L32%2020L46%2040'%20stroke='%238B96A8'%20stroke-width='2'%20fill='none'/%3E%3C/svg%3E">

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

/* ===================== DESIGN TOKENS ===================== */
:root{
  --bg:#070B14;
  --bg-2:#0D1320;
  --card:rgba(17, 24, 39, 0.65);
  --card-hover:rgba(20, 30, 48, 0.85);
  --border:rgba(30, 41, 59, 0.8);
  --border-soft:rgba(24, 34, 52, 0.6);
  --text:#F5F7FA;
  --text-dim:#8B96A8;
  --text-faint:#5B6576;
  --cyan:#22D3C7;
  --blue:#3B82F6;
  --purple:#8B5CF6;
  --whatsapp:#25D366;
  --radius:12px;
  --radius-lg:20px;
  --shadow:0 10px 30px -10px rgba(0,0,0,0.5);
  --shadow-lg:0 20px 50px -15px rgba(34, 211, 199, 0.15);
  --glow:0 0 25px rgba(34,211,199,0.35);
  --font-display:'Manrope', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  --max-w:1280px;
  color-scheme: dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* Background Animated Gradient Mesh */
body::before {
  content: "";
  position: fixed;
  top: -20%; left: -20%;
  width: 140%; height: 140%;
  background: 
    radial-gradient(circle at 15% 20%, rgba(34, 211, 199, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 60%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 50% 85%, rgba(139, 92, 246, 0.06) 0%, transparent 45%);
  z-index: -1;
  animation: meshFloat 18s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes meshFloat {
  0% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-30px) scale(1.05); }
  100% { transform: translateY(20px) scale(0.98); }
}

a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.18;margin:0 0 .5em}
h1{font-size:clamp(2.4rem,5vw,4rem);letter-spacing:-.03em}

.container{max-width:var(--max-w);margin:0 auto;padding:0 24px}
section{padding:80px 0}

/* Animated Gradient Text */
.gradient-text {
  background: linear-gradient(135deg, #fff 20%, var(--cyan) 60%, var(--blue) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 6s ease infinite;
}
@keyframes shine {
  to { background-position: 200% center; }
}

/* ===================== BUTTONS ===================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--font-body);font-weight:600;font-size:.95rem;
  padding:14px 28px;border-radius:12px;border:1px solid transparent;
  cursor:pointer;transition:all .3s cubic-bezier(0.16, 1, 0.3, 1);
  position:relative;overflow:hidden;
}
.btn-primary{
  background:linear-gradient(135deg, var(--cyan), var(--blue));
  color:#04121A;
  box-shadow: 0 4px 15px rgba(34, 211, 199, 0.25);
}
.btn-primary:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 8px 25px rgba(34, 211, 199, 0.45);
}
.btn-primary::after {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: linear-gradient(60deg, transparent, rgba(255,255,255,0.3), transparent);
  transform: rotate(30deg) translateY(-100%);
  transition: transform 0.6s ease;
}
.btn-primary:hover::after { transform: rotate(30deg) translateY(100%); }

/* ===================== HEADER ===================== */
header.site-header{
  position:sticky;top:0;z-index:100;
  background:rgba(7, 11, 20, 0.7);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border-soft);
}
.nav-wrap{max-width:var(--max-w);margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;transition:transform 0.4s ease}
.brand:hover .brand-mark { transform: rotate(180deg) scale(1.1); }
.brand-word{font-family:var(--font-display);font-weight:800;font-size:1.15rem}
.brand-word span{color:var(--cyan)}

/* Nav Links Animation */
nav.primary-nav{display:flex;align-items:center;gap:32px}
nav.primary-nav a{
  font-size:.95rem;font-weight:500;color:var(--text-dim);
  position:relative;padding:6px 0;transition:color 0.2s ease;
}
nav.primary-nav a:hover{color:var(--cyan)}
nav.primary-nav a::after{
  content:"";position:absolute;left:50%;bottom:0;width:0;height:2px;
  background:linear-gradient(90deg,var(--cyan),var(--blue));
  transition:all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  transform: translateX(-50%);
  border-radius:2px;
}
nav.primary-nav a:hover::after{width:100%}

/* ===================== HERO SECTION ===================== */
.hero{position:relative;padding:120px 0 80px;text-align:center;overflow:hidden}
.hero-content { max-width: 800px; margin: 0 auto; }
.hero-title { margin-bottom: 24px; }
.hero-subtitle { font-size: 1.2rem; color: var(--text-dim); margin-bottom: 40px; }

/* Interactive Floating Grid Particles */
.particle {
  position: absolute; border-radius: 50%;
  background: rgba(34, 211, 199, 0.4);
  animation: floatUp 8s linear infinite;
  pointer-events: none;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  50% { opacity: 0.8; }
  100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* ===================== CARDS & TILT ANIMATION ===================== */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.tool-card{
  background:var(--card);
  backdrop-filter: blur(12px);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:26px;
  display:flex;flex-direction:column;gap:16px;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
              border-color 0.3s ease, 
              box-shadow 0.4s ease;
  position:relative;
  transform-style: preserve-3d;
  will-change: transform;
}
.tool-card:hover{
  transform: translateY(-8px) scale(1.01);
  border-color: rgba(34, 211, 199, 0.5);
  box-shadow: var(--shadow-lg);
}

/* Glow Accent on Hover */
.tool-card::before {
  content: "";
  position: absolute; inset: -1px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--cyan), transparent, var(--blue));
  z-index: -1; opacity: 0;
  transition: opacity 0.4s ease;
}
.tool-card:hover::before { opacity: 0.3; }

.tool-top{display:flex;align-items:center;gap:14px}
.tool-logo{
  width:50px;height:50px;border-radius:14px;
  background:linear-gradient(135deg, rgba(34, 211, 199, 0.15), rgba(59, 130, 246, 0.15));
  border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--cyan);font-size:1.2rem;
}
.tool-name{font-size:1.1rem;margin:0}
.tool-desc{font-size:.9rem;color:var(--text-dim);flex:1;margin:0}

/* Badge Pulse Animation */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 0.75rem;
  padding: 4px 10px; border-radius: 20px;
  background: rgba(34, 211, 199, 0.1); color: var(--cyan);
  border: 1px solid rgba(34, 211, 199, 0.3);
}
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.5); opacity: 0.4; }
}

/* ===================== WHATSAPP FLOAT ===================== */
.wa-float{
  position:fixed;right:24px;bottom:24px;z-index:99;
  width:60px;height:60px;border-radius:50%;
  background:var(--whatsapp);
  display:flex;align-items:center;justify-content:center;
  color:#04250F;
  box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  animation: floatBounce 4s ease-in-out infinite;
}
.wa-float:hover{
  transform: scale(1.15) rotate(10deg);
  box-shadow: 0 15px 30px rgba(37, 211, 102, 0.6);
}
@keyframes floatBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* Page Transition Wrapper */
.fade-in {
  animation: fadeIn 0.6s ease forwards;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="#" class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" fill="none">
        <rect width="64" height="64" rx="16" fill="#0D1320"/>
        <path d="M20 44L32 20L46 40" stroke="#5B6576" stroke-width="2.5"/>
        <circle cx="20" cy="44" r="5" fill="#22D3C7"/>
        <circle cx="32" cy="20" r="5" fill="#3B82F6"/>
        <circle cx="46" cy="40" r="5" fill="#22D3C7"/>
      </svg>
      <span class="brand-word">AI Tools <span>by SK</span></span>
    </a>
    <nav class="primary-nav">
      <a href="#tools">Explore Tools</a>
      <a href="#categories">Categories</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<div class="hero">
  <!-- Particles injected by JS -->
  <div id="particle-container"></div>
  
  <div class="container hero-content fade-in">
    <div class="badge" style="margin-bottom: 20px;">
      <span class="pulse-dot"></span> Next-Gen AI Directory
    </div>
    <h1 class="hero-title">Unlock Next-Level Intelligence with <span class="gradient-text">AI Tools by SK</span></h1>
    <p class="hero-subtitle">Premium access to cutting-edge writing, video, audio & automation tools — delivered instantly with custom pricing support.</p>
    <div>
      <a href="#tools" class="btn btn-primary">Browse All Tools ✨</a>
    </div>
  </div>
</div>

<section id="tools" class="container">
  <h2 style="margin-bottom: 30px;" class="gradient-text">Featured AI Suite</h2>
  
  <div class="tools-grid" id="tools-container">
    <!-- Dynamic animated cards rendered via JS -->
  </div>
</section>

<a class="wa-float" href="https://wa.me/923086831350" target="_blank" title="Order on WhatsApp">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18.2a8.1 8.1 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.4c.1-.1.2-.2.2-.4.1-.1 0-.3 0-.4-.1-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.3c.1.2 1.6 2.5 4 3.4.5.2.9.4 1.3.5.5.2 1 .1 1.4.1.4-.1 1.3-.5 1.5-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/></svg>
</a>

<script>
// Mock Data
const TOOLS_DATA = [
  { name: "ChatGPT Plus", category: "AI Assistant / Scripting", desc: "Advanced reasoning, vision, and custom GPTs for ultimate productivity.", tag: "Popular" },
  { name: "Midjourney", category: "AI Image Generation", desc: "Create photorealistic visuals and concept art using simple text prompts.", tag: "Trending" },
  { name: "ElevenLabs", category: "Voice & Speech Synthesis", desc: "Ultra-realistic text-to-speech audio with custom voice cloning.", tag: "Featured" },
  { name: "Runway Gen-2", category: "AI Video Generation", desc: "Generate cinematic videos directly from text, images, or video clips.", tag: "Hot" },
  { name: "Claude 3.5 Sonnet", category: "Coding & Creative Writing", desc: "Top-tier intelligence for deep analytical writing and coding projects.", tag: "Pro Pick" },
  { name: "Perplexity Pro", category: "AI Search & Research", desc: "Real-time, cited search answers designed for modern research tasks.", tag: "Smart" }
];

// Render Tool Cards Dynamically
const toolsContainer = document.getElementById("tools-container");

TOOLS_DATA.forEach((tool, idx) => {
  const card = document.createElement("div");
  card.className = "tool-card fade-in";
  card.style.animationDelay = `${idx * 0.1}s`;

  card.innerHTML = `
    <div class="tool-top">
      <div class="tool-logo">${tool.name[0]}</div>
      <div>
        <h3 class="tool-name">${tool.name}</h3>
        <span class="badge" style="margin-top: 4px;">${tool.tag}</span>
      </div>
    </div>
    <p class="tool-desc">${tool.desc}</p>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px;">
      <span style="font-size: 0.8rem; color: var(--text-faint); font-family: var(--font-mono);">${tool.category}</span>
      <a href="https://wa.me/923086831350?text=I%20want%20to%20order%20access%20for%20${encodeURIComponent(tool.name)}" 
         target="_blank" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.82rem;">Order Access</a>
    </div>
  `;
  toolsContainer.appendChild(card);
});

// Interactive 3D Card Tilt Effect on Mouse move
document.querySelectorAll('.tool-card').forEach(card => {
  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    
    const rotateX = (y - centerY) / 12;
    const rotateY = (centerX - x) / 12;
    
    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px)`;
  });
  
  card.addEventListener('mouseleave', () => {
    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
  });
});

// Dynamic Floating Particle Generator
const particleContainer = document.getElementById('particle-container');
for(let i = 0; i < 20; i++) {
  const particle = document.createElement('div');
  particle.className = 'particle';
  particle.style.left = `${Math.random() * 100}%`;
  particle.style.width = particle.style.height = `${Math.random() * 4 + 2}px`;
  particle.style.animationDuration = `${Math.random() * 6 + 6}s`;
  particle.style.animationDelay = `${Math.random() * 5}s`;
  particleContainer.appendChild(particle);
}
</script>
</body>
</html>
